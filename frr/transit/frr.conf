frr defaults traditional
hostname transit
log stdout
no ipv6 forwarding
!
! AS65001 -- the transit provider. Peers with everyone, reflects routes between
! them. It does NOT filter anything, which is the whole problem being modelled:
! a transit provider that accepts whatever its customers announce.
!
router bgp 65001
 bgp router-id 10.99.0.1
 no bgp ebgp-requires-policy
 neighbor 10.99.0.2 remote-as 65002
 neighbor 10.99.0.2 description ISP-legitimate-holder
 neighbor 10.99.0.3 remote-as 65003
 neighbor 10.99.0.3 description CUSTOMER-downstream
 neighbor 10.99.0.4 remote-as 65004
 neighbor 10.99.0.4 description ROGUE-hijacker
 !
 address-family ipv4 unicast
  neighbor 10.99.0.2 activate
  neighbor 10.99.0.3 activate
  neighbor 10.99.0.4 activate
 exit-address-family
!
! ---------------------------------------------------------------------------
! Phase 6 (RTBH) scaffolding -- staged but NOT applied.
!
! 192.0.2.1 is the "discard next-hop": a bogus address statically routed to
! nowhere. Any BGP route whose next-hop is rewritten to it resolves into a
! blackhole, so traffic dies here at the provider edge instead of riding the
! link down to the customer. That is the entire trick.
! ---------------------------------------------------------------------------
!
ip route 192.0.2.1/32 blackhole
!
! 65535:666 is the well-known BLACKHOLE community from RFC 7999.
! 65001:666 is the provider-specific flavour -- most ISPs publish one of these
! and document it on their peering page. Accept both.
bgp community-list standard BLACKHOLE-WELLKNOWN permit 65535:666
bgp community-list standard BLACKHOLE-LOCAL permit 65001:666
!
route-map RTBH-IN permit 10
 match community BLACKHOLE-WELLKNOWN
 set ip next-hop 192.0.2.1
 set local-preference 200
!
route-map RTBH-IN permit 20
 match community BLACKHOLE-LOCAL
 set ip next-hop 192.0.2.1
 set local-preference 200
!
route-map RTBH-IN permit 30
!
line vty
!
