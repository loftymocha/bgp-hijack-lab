frr defaults traditional
hostname customer
log stdout
no ipv6 forwarding
!
! AS65003 -- the downstream observer. This is the router you spend most of the
! lab logged into. It learns everything through transit.
!
! The RPKI cache session is UP from the start so you can inspect the VRP table,
! but NO route-map is applied yet -- the hijack in Phase 2 must succeed before
! you fix it in Phase 3. Validation state is visible without being enforced.
!
rpki
 rpki cache tcp 10.99.0.10 3323 preference 1
exit
!
router bgp 65003
 bgp router-id 10.99.0.3
 no bgp ebgp-requires-policy
 neighbor 10.99.0.1 remote-as 65001
 neighbor 10.99.0.1 description TRANSIT
 !
 address-family ipv4 unicast
  neighbor 10.99.0.1 activate
 exit-address-family
!
! Staged but NOT applied. Phase 3 attaches this inbound.
route-map RPKI-FILTER deny 10
 match rpki invalid
!
route-map RPKI-FILTER permit 20
 set local-preference 100
!
line vty
!
