frr defaults traditional
hostname isp
log stdout
no ipv6 forwarding
!
! AS65002 -- the legitimate holder of 203.0.113.0/24.
! The blackhole static exists only so the "network" statement has something in
! the RIB to originate from. Real routers originate from a real connected route.
!
ip route 203.0.113.0/24 blackhole
ip route 198.51.100.0/24 blackhole
!
! Phase 6: the /32 of the host "under attack". Staged in the RIB so the
! announcement is a single command later.
ip route 203.0.113.50/32 blackhole
!
! Tags the /32 with both blackhole communities plus no-export, so the provider
! drops it but does not leak it onward to its other customers. RFC 7999 says
! BLACKHOLE SHOULD carry NO_EXPORT or NO_ADVERTISE -- a blackhole that escapes
! your provider's AS is a self-inflicted outage with extra steps.
route-map SET-BLACKHOLE permit 10
 set community 65535:666 65001:666 no-export additive
!
router bgp 65002
 bgp router-id 10.99.0.2
 no bgp ebgp-requires-policy
 neighbor 10.99.0.1 remote-as 65001
 neighbor 10.99.0.1 description TRANSIT
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 198.51.100.0/24
  neighbor 10.99.0.1 activate
 exit-address-family
!
line vty
!
