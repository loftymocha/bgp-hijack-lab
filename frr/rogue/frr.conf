frr defaults traditional
hostname rogue
log stdout
no ipv6 forwarding
!
! AS65004 -- the hijacker. Ships CLEAN: the blackhole routes are staged in the
! RIB but nothing is announced yet. You add the announcements by hand in Phase 2
! so you can watch the table change in real time on the customer router.
!
ip route 203.0.113.0/24 blackhole
ip route 203.0.113.0/25 blackhole
ip route 203.0.113.128/25 blackhole
!
router bgp 65004
 bgp router-id 10.99.0.4
 no bgp ebgp-requires-policy
 neighbor 10.99.0.1 remote-as 65001
 neighbor 10.99.0.1 description TRANSIT
 !
 address-family ipv4 unicast
  neighbor 10.99.0.1 activate
 exit-address-family
!
line vty
!
